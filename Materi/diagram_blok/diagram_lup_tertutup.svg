<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DIAGRAM BLOK SISTEM KENDALI LUP TERTUTUP (CLOSED-LOOP)</text>

  <!-- Input Arrow -->
  <line x1="30" y1="95" x2="120" y2="95" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="75" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Masukan Acuan</text>
  <text x="75" y="118" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">r(t) / Setpoint</text>

  <!-- Summing Junction -->
  <circle cx="140" cy="95" r="18" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2" filter="url(#shadow)"/>
  <!-- Cross inside junction -->
  <line x1="127" y1="82" x2="153" y2="108" stroke="#64748b" stroke-width="1.2"/>
  <line x1="127" y1="108" x2="153" y2="82" stroke="#64748b" stroke-width="1.2"/>
  <text x="114" y="90" font-size="15" font-weight="700" fill="#15803d">+</text>
  <text x="145" y="128" font-size="17" font-weight="700" fill="#b91c1c">-</text>

  <!-- Error Arrow -->
  <line x1="158" y1="95" x2="250" y2="95" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="204" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">Sinyal Galat</text>
  <text x="204" y="118" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">e(t) = r(t) - b(t)</text>

  <!-- Controller Block -->
  <rect x="250" y="60" width="165" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">PENGENDALI</text>
  <text x="332" y="112" text-anchor="middle" font-size="11" fill="#166534">Controller</text>

  <!-- Control Signal Arrow -->
  <line x1="415" y1="95" x2="510" y2="95" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="462" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Sinyal Kendali</text>
  <text x="462" y="118" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">u(t) / Manipulated</text>

  <!-- Plant/Process Block -->
  <rect x="510" y="60" width="165" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="592" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">KENDALIAN / PROSES</text>
  <text x="592" y="112" text-anchor="middle" font-size="11" fill="#1e40af">Plant / Process</text>

  <!-- Disturbance Arrow into Plant -->
  <line x1="592" y1="5" x2="592" y2="58" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="24" font-size="11" font-weight="600" fill="#dc2626">Gangguan / Disturbance d(t)</text>

  <!-- Output Arrow & Pickoff Point -->
  <line x1="675" y1="95" x2="820" y2="95" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="740" cy="95" r="4.5" fill="#1e293b"/>
  <text x="785" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Keluaran Aktual</text>
  <text x="785" y="118" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">c(t) / Output</text>

  <!-- Feedback Path (Down, Left, Up) -->
  <line x1="740" y1="95" x2="740" y2="235" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="740" y1="235" x2="550" y2="235" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Sensor / Feedback Block -->
  <rect x="360" y="200" width="190" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="455" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">SENSOR / TRANSMITTER</text>
  <text x="455" y="252" text-anchor="middle" font-size="11" fill="#92400e">Feedback / Measurement</text>

  <!-- Feedback Line to Junction -->
  <line x1="360" y1="235" x2="140" y2="235" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="140" y1="235" x2="140" y2="115" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="250" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Sinyal Umpan Balik</text>
  <text x="250" y="255" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">b(t) = H * c(t)</text>
</svg>