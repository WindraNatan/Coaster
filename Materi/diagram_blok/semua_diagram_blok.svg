<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1260" width="100%" height="100%" style="background:#f8fafc; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Page Header -->
  <text x="510" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">KUMPULAN DIAGRAM BLOK RESMI SISTEM KENDALI</text>
  <text x="510" y="58" text-anchor="middle" font-size="12" fill="#64748b">Rujukan Gambar Tulis Tangan UTS - Sesuai Silabus &amp; Bank Soal 2023</text>

  <!-- ========================================== -->
  <!-- SECTION 1: LUP TERBUKA -->
  <!-- ========================================== -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="960" height="200" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="30" y="32" font-size="14" font-weight="700" fill="#15803d">1. DIAGRAM BLOK LUP TERBUKA (OPEN-LOOP CONTROL SYSTEM)</text>
    <text x="890" y="32" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">Soal 1.a &amp; Soal 3.a</text>

    <!-- Content -->
    <g transform="translate(110, 45)">
      <!-- Input Arrow -->
      <line x1="10" y1="65" x2="110" y2="65" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="60" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Masukan Acuan</text>
      <text x="60" y="85" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">r(t) / Desired Input</text>

      <!-- Controller Block -->
      <rect x="110" y="30" width="180" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="200" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">PENGENDALI</text>
      <text x="200" y="80" text-anchor="middle" font-size="11" fill="#166534">Controller / Actuator</text>

      <!-- Mid Arrow -->
      <line x1="290" y1="65" x2="400" y2="65" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="345" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Sinyal Kendali</text>
      <text x="345" y="85" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">u(t) / Manipulated</text>

      <!-- Plant Block -->
      <rect x="400" y="30" width="180" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="490" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">KENDALIAN / PROSES</text>
      <text x="490" y="80" text-anchor="middle" font-size="11" fill="#1e40af">Plant / Process</text>

      <!-- Output Arrow -->
      <line x1="580" y1="65" x2="710" y2="65" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="650" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Keluaran Aktual</text>
      <text x="650" y="85" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">c(t) / Output</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 2: LUP TERTUTUP -->
  <!-- ========================================== -->
  <g transform="translate(30, 305)">
    <rect x="0" y="0" width="960" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="30" y="32" font-size="14" font-weight="700" fill="#1d4ed8">2. DIAGRAM BLOK LUP TERTUTUP (CLOSED-LOOP CONTROL SYSTEM)</text>
    <text x="890" y="32" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">Soal 1.a &amp; Soal 3.b</text>

    <!-- Content -->
    <g transform="translate(60, 45)">
      <!-- Input Arrow -->
      <line x1="10" y1="70" x2="100" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="55" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Masukan Acuan</text>
      <text x="55" y="90" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">r(t) / Setpoint</text>

      <!-- Summing Junction -->
      <circle cx="120" cy="70" r="18" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="107" y1="57" x2="133" y2="83" stroke="#64748b" stroke-width="1.2"/>
      <line x1="107" y1="83" x2="133" y2="57" stroke="#64748b" stroke-width="1.2"/>
      <text x="94" y="65" font-size="15" font-weight="700" fill="#15803d">+</text>
      <text x="125" y="103" font-size="17" font-weight="700" fill="#b91c1c">-</text>

      <!-- Error Arrow -->
      <line x1="138" y1="70" x2="230" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="184" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Sinyal Galat</text>
      <text x="184" y="90" text-anchor="middle" font-size="10" fill="#b91c1c" font-style="italic">e(t) = r(t) - b(t)</text>

      <!-- Controller -->
      <rect x="230" y="35" width="165" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="312" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">PENGENDALI</text>
      <text x="312" y="86" text-anchor="middle" font-size="11" fill="#166534">Controller</text>

      <!-- Control Signal -->
      <line x1="395" y1="70" x2="490" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="442" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Sinyal Kendali</text>
      <text x="442" y="90" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">u(t)</text>

      <!-- Plant -->
      <rect x="490" y="35" width="165" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="572" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">KENDALIAN / PLANT</text>
      <text x="572" y="86" text-anchor="middle" font-size="11" fill="#1e40af">Plant / Process</text>

      <!-- Disturbance -->
      <line x1="572" y1="-10" x2="572" y2="33" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="580" y="10" font-size="10" font-weight="600" fill="#dc2626">Gangguan / Disturbance d(t)</text>

      <!-- Output -->
      <line x1="655" y1="70" x2="810" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <circle cx="720" cy="70" r="4.5" fill="#1e293b"/>
      <text x="765" y="53" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Keluaran Aktual</text>
      <text x="765" y="90" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">c(t) / Output</text>

      <!-- Feedback Line -->
      <line x1="720" y1="70" x2="720" y2="195" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="720" y1="195" x2="530" y2="195" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>

      <!-- Sensor Block -->
      <rect x="340" y="160" width="190" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="435" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">SENSOR / TRANSMITTER</text>
      <text x="435" y="212" text-anchor="middle" font-size="11" fill="#92400e">Feedback Element</text>

      <!-- Line to Junction -->
      <line x1="340" y1="195" x2="120" y2="195" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="120" y1="195" x2="120" y2="90" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="230" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Sinyal Umpan Balik</text>
      <text x="230" y="215" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">b(t) = H * c(t)</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 3: ANTENA AZIMUTH (SOAL 2) -->
  <!-- ========================================== -->
  <g transform="translate(30, 620)">
    <rect x="0" y="0" width="960" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="30" y="32" font-size="14" font-weight="700" fill="#b45309">3. APLIKASI CLOSED-LOOP RESMI: KENDALI POSISI SUDUT ANTENA AZIMUTH</text>
    <text x="890" y="32" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">Soal 2 Utama (Slide Bab 1)</text>

    <!-- Content -->
    <g transform="translate(0, 45)">
      <!-- Input -->
      <line x1="15" y1="75" x2="65" y2="75" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="40" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Sudut Input</text>
      <text x="40" y="95" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">&#952;i(t)</text>

      <!-- Block 1: Potentiometer Input -->
      <rect x="65" y="40" width="140" height="70" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
      <text x="135" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">TRANSDUSER INPUT</text>
      <text x="135" y="84" text-anchor="middle" font-size="10" fill="#475569">Potensiometer Input</text>
      <text x="135" y="98" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">Gain K_pot</text>

      <!-- Vi Line -->
      <line x1="205" y1="75" x2="280" y2="75" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="242" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Tegangan Vi</text>
      <text x="242" y="95" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">Vi = K*&#952;i</text>

      <!-- Summing Junction -->
      <circle cx="300" cy="75" r="18" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="287" y1="62" x2="313" y2="88" stroke="#64748b" stroke-width="1.2"/>
      <line x1="287" y1="88" x2="313" y2="62" stroke="#64748b" stroke-width="1.2"/>
      <text x="274" y="70" font-size="15" font-weight="700" fill="#15803d">+</text>
      <text x="305" y="108" font-size="17" font-weight="700" fill="#b91c1c">-</text>

      <!-- Ve Line -->
      <line x1="318" y1="75" x2="395" y2="75" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="356" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">Galat Ve</text>
      <text x="356" y="95" text-anchor="middle" font-size="9" fill="#b91c1c" font-style="italic">Ve = Vi - Vo</text>

      <!-- Block 2: Amplifiers -->
      <rect x="395" y="40" width="165" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="477" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">PENGENDALI</text>
      <text x="477" y="84" text-anchor="middle" font-size="10" fill="#166534">Penguat Sinyal &amp;</text>
      <text x="477" y="98" text-anchor="middle" font-size="10" fill="#166534">Penguat Daya (Gain K)</text>

      <!-- Va Line -->
      <line x1="560" y1="75" x2="635" y2="75" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="597" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Tegangan Va</text>
      <text x="597" y="95" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">ke Motor</text>

      <!-- Block 3: Motor & Antenna -->
      <rect x="635" y="40" width="175" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="722" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">KENDALIAN / PLANT</text>
      <text x="722" y="84" text-anchor="middle" font-size="10" fill="#1e40af">Motor DC, Roda Gigi</text>
      <text x="722" y="98" text-anchor="middle" font-size="10" fill="#1e40af">&amp; Beban Antena Fisik</text>

      <!-- Output -->
      <line x1="810" y1="75" x2="945" y2="75" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <circle cx="875" cy="75" r="4.5" fill="#1e293b"/>
      <text x="910" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Sudut Aktual</text>
      <text x="910" y="95" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">&#952;o(t)</text>

      <!-- Feedback Line -->
      <line x1="875" y1="75" x2="875" y2="210" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="875" y1="210" x2="695" y2="210" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>

      <!-- Block 4: Output Potentiometer -->
      <rect x="515" y="175" width="180" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="605" y="201" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">TRANSDUSER OUTPUT</text>
      <text x="605" y="219" text-anchor="middle" font-size="10" fill="#92400e">Potensiometer Sensor</text>
      <text x="605" y="233" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">(Deteksi Poros Keluaran)</text>

      <!-- Feedback to Junction -->
      <line x1="515" y1="210" x2="300" y2="210" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="300" y1="210" x2="300" y2="95" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="407" y="197" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Tegangan Umpan Balik</text>
      <text x="407" y="230" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">Vo(t) = K_pot * &#952;o(t)</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 4: FLYBALL GOVERNOR (SOAL 2 ALT) -->
  <!-- ========================================== -->
  <g transform="translate(30, 940)">
    <rect x="0" y="0" width="960" height="290" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="30" y="32" font-size="14" font-weight="700" fill="#475569">4. APLIKASI ALTERNATIF: REGULATOR KECEPATAN MESIN UAP JAMES WATT</text>
    <text x="890" y="32" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">Soal 2 Alternatif (Terkait Narasi Soal)</text>

    <!-- Content -->
    <g transform="translate(10, 40)">
      <!-- Input -->
      <line x1="15" y1="70" x2="95" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="55" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Kecepatan Target</text>
      <text x="55" y="90" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">&#969;_ref</text>

      <!-- Mechanical Junction -->
      <circle cx="115" cy="70" r="18" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="102" y1="57" x2="128" y2="83" stroke="#64748b" stroke-width="1.2"/>
      <line x1="102" y1="83" x2="128" y2="57" stroke="#64748b" stroke-width="1.2"/>
      <text x="89" y="65" font-size="15" font-weight="700" fill="#15803d">+</text>
      <text x="120" y="103" font-size="17" font-weight="700" fill="#b91c1c">-</text>

      <!-- Displacement -->
      <line x1="133" y1="70" x2="215" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="174" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">Selisih Tuas</text>
      <text x="174" y="90" text-anchor="middle" font-size="9" fill="#b91c1c" font-style="italic">&#916;x</text>

      <!-- Valve Block -->
      <rect x="215" y="35" width="160" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="295" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">AKTUATOR</text>
      <text x="295" y="80" text-anchor="middle" font-size="10" fill="#166534">Katup Uap</text>
      <text x="295" y="94" text-anchor="middle" font-size="9" fill="#166534" font-style="italic">(Steam Valve)</text>

      <!-- Flow Arrow -->
      <line x1="375" y1="70" x2="470" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="422" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Debit Uap</text>
      <text x="422" y="90" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">q_steam</text>

      <!-- Engine Block -->
      <rect x="470" y="35" width="175" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="557" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">KENDALIAN / PLANT</text>
      <text x="557" y="80" text-anchor="middle" font-size="10" fill="#1e40af">Silinder Mesin Uap,</text>
      <text x="557" y="94" text-anchor="middle" font-size="9" fill="#1e40af">Torak, &amp; Poros Beban</text>

      <!-- Disturbance -->
      <line x1="557" y1="-8" x2="557" y2="33" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="565" y="10" font-size="10" font-weight="600" fill="#dc2626">Gangguan Beban T_load(t)</text>

      <!-- Output -->
      <line x1="645" y1="70" x2="850" y2="70" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <circle cx="770" cy="70" r="4.5" fill="#1e293b"/>
      <text x="810" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Kecepatan Poros</text>
      <text x="810" y="90" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">&#969;(t) [RPM]</text>

      <!-- Feedback Line -->
      <line x1="770" y1="70" x2="770" y2="195" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="770" y1="195" x2="600" y2="195" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>

      <!-- Governor Block -->
      <rect x="410" y="160" width="190" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="505" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">SENSOR / UMPAN BALIK</text>
      <text x="505" y="204" text-anchor="middle" font-size="10" fill="#92400e">Flyball Governor</text>
      <text x="505" y="218" text-anchor="middle" font-size="9" fill="#92400e" font-style="italic">(Gaya Sentrifugal Bola)</text>

      <!-- Feedback to Junction -->
      <line x1="410" y1="195" x2="115" y2="195" stroke="#1e293b" stroke-width="2.2"/>
      <line x1="115" y1="195" x2="115" y2="90" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
      <text x="260" y="182" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Posisi Selongsong Umpan Balik</text>
      <text x="260" y="215" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">x_fb proporsional &#969;^2</text>
    </g>
  </g>
</svg>
