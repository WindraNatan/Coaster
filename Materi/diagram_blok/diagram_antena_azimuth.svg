<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="490" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DIAGRAM BLOK FUNGSIONAL SISTEM KENDALI POSISI SUDUT ANTENA AZIMUTH (SOAL 2 UTS)</text>

  <!-- Input Arrow -->
  <line x1="20" y1="105" x2="80" y2="105" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="50" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Sudut Acuan</text>
  <text x="50" y="126" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">&#952;i(t) [rad]</text>

  <!-- Block 1: Input Transducer -->
  <rect x="80" y="70" width="150" height="70" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">TRANSDUSER INPUT</text>
  <text x="155" y="114" text-anchor="middle" font-size="11" fill="#475569">Potensiometer Input</text>
  <text x="155" y="128" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Gain K_pot</text>

  <!-- Vi Arrow -->
  <line x1="230" y1="105" x2="310" y2="105" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="270" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Tegangan Vi(t)</text>
  <text x="270" y="126" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Vi = K_pot * &#952;i</text>

  <!-- Summing Junction -->
  <circle cx="330" cy="105" r="18" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2" filter="url(#shadow)"/>
  <line x1="317" y1="92" x2="343" y2="118" stroke="#64748b" stroke-width="1.2"/>
  <line x1="317" y1="118" x2="343" y2="92" stroke="#64748b" stroke-width="1.2"/>
  <text x="304" y="100" font-size="15" font-weight="700" fill="#15803d">+</text>
  <text x="335" y="138" font-size="17" font-weight="700" fill="#b91c1c">-</text>

  <!-- Ve Arrow -->
  <line x1="348" y1="105" x2="430" y2="105" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="388" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">Tegangan Galat</text>
  <text x="388" y="126" text-anchor="middle" font-size="10" fill="#b91c1c" font-style="italic">Ve = Vi - Vo</text>

  <!-- Block 2: Controller -->
  <rect x="430" y="70" width="170" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="515" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">PENGENDALI</text>
  <text x="515" y="114" text-anchor="middle" font-size="11" fill="#166534">Penguat Diferensial &amp;</text>
  <text x="515" y="128" text-anchor="middle" font-size="11" fill="#166534">Penguat Daya (Gain K)</text>

  <!-- Va Arrow -->
  <line x1="600" y1="105" x2="680" y2="105" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="640" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Tegangan Jangkar</text>
  <text x="640" y="126" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Va(t) ke Motor</text>

  <!-- Block 3: Plant -->
  <rect x="680" y="70" width="180" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">KENDALIAN / PLANT</text>
  <text x="770" y="114" text-anchor="middle" font-size="11" fill="#1e40af">Motor DC, Roda Gigi</text>
  <text x="770" y="128" text-anchor="middle" font-size="11" fill="#1e40af">&amp; Beban Antena Fisik</text>

  <!-- Output Arrow & Pickoff -->
  <line x1="860" y1="105" x2="960" y2="105" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="910" cy="105" r="4.5" fill="#1e293b"/>
  <text x="925" y="86" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Sudut Aktual</text>
  <text x="925" y="126" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">&#952;o(t) [rad]</text>

  <!-- Feedback Path (Down, Left, Up) -->
  <line x1="910" y1="105" x2="910" y2="255" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="910" y1="255" x2="710" y2="255" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Block 4: Feedback Sensor -->
  <rect x="520" y="220" width="190" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">TRANSDUSER OUTPUT</text>
  <text x="615" y="264" text-anchor="middle" font-size="11" fill="#92400e">Potensiometer Sensor</text>
  <text x="615" y="278" text-anchor="middle" font-size="10" fill="#92400e" font-style="italic">(Mendeteksi Poros &#952;o)</text>

  <!-- Line from Sensor to Junction -->
  <line x1="520" y1="255" x2="330" y2="255" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="330" y1="255" x2="330" y2="125" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="425" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Tegangan Umpan Balik</text>
  <text x="425" y="275" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Vo(t) = K_pot * &#952;o(t)</text>
</svg>