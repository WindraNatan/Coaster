<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DIAGRAM BLOK SISTEM KENDALI LUP TERBUKA (OPEN-LOOP)</text>

  <!-- Input Arrow -->
  <line x1="40" y1="100" x2="140" y2="100" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="90" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Masukan Acuan</text>
  <text x="90" y="122" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">r(t) / Desired Input</text>

  <!-- Controller Block -->
  <rect x="140" y="65" width="180" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">PENGENDALI</text>
  <text x="230" y="116" text-anchor="middle" font-size="11" fill="#166534">Controller / Actuator</text>

  <!-- Mid Arrow -->
  <line x1="320" y1="100" x2="430" y2="100" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="375" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Sinyal Kendali</text>
  <text x="375" y="122" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">u(t) / Manipulated Var</text>

  <!-- Plant/Process Block -->
  <rect x="430" y="65" width="180" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">KENDALIAN / PROSES</text>
  <text x="520" y="116" text-anchor="middle" font-size="11" fill="#1e40af">Plant / Process</text>

  <!-- Output Arrow -->
  <line x1="610" y1="100" x2="720" y2="100" stroke="#1e293b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="668" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Keluaran Aktual</text>
  <text x="668" y="122" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">c(t) / Output</text>
</svg>