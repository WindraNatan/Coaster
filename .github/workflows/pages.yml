name: Deploy web PWA

# Unggah isi web/ sebagai root artifact agar URL Pages bersih di root.
on:
  push:
    branches: [master]
    paths: ['web/**', 'app/**', 'tools/**', 'SmartHydrationCoaster/**',
           'test_simulation.py', 'firebase-rules.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tes web
        run: |
          node web/fsm.test.js
          node web/daily-history.test.js
          node web/daily-cloud.test.js
          node web/protocol.test.js
      - name: Build web (Vite)
        run: |
          cd web && npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Tes paritas Python
        run: python test_simulation.py
      - name: Garda berkas aturan Firebase
        run: python tools/cek_aturan_berkas.py
      - name: Garda tata letak sasis
        run: python tools/cad_check/verify_stackup.py
      - name: Harness FSM (C++)
        run: |
          cd tools/uji_fsm
          g++ -std=c++17 -Wall -Wextra -I. -I../../SmartHydrationCoaster -o uji_fsm uji_fsm.cpp
          ./uji_fsm
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tes Flutter dipisah agar kegagalan app tidak memblokir deploy web.
  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependensi
        run: flutter pub get
        working-directory: app
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Test
        run: flutter test
        working-directory: app
