<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hydration Coaster</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>

  <!-- Script test parity compatibility for node daily-history.test.js and daily-cloud.test.js -->
  <script>
    function loadDailyHistory(){
      try { return JSON.parse(localStorage.getItem('shc_daily_history') || '{}'); } catch(_){ return {}; }
    }
    function dayBaseline(){
      try { return JSON.parse(localStorage.getItem('shc_day_base') || 'null'); } catch(_){ return null; }
    }
    function ensureDayBaseline(totMl, drink, refill, cheat){
      const k = todayKey();
      const b = dayBaseline();
      const turun = b && (totMl < b.total_ml || drink < b.drink_count);
      if (b && b.date === k && !turun) return b;
      const next = { date: k, total_ml: totMl, drink_count: drink, refill_count: refill, cheat_count: cheat };
      localStorage.setItem('shc_day_base', JSON.stringify(next));
      return next;
    }
    function todayDelta(totMl, drink, refill, cheat){
      const b = ensureDayBaseline(totMl, drink, refill, cheat);
      return {
        total_ml: Math.max(0, totMl - b.total_ml),
        drink_count: Math.max(0, drink - b.drink_count),
        refill_count: Math.max(0, refill - b.refill_count),
        cheat_count: Math.max(0, cheat - b.cheat_count)
      };
    }
    function saveTodayStatsToHistory(){
      const hist = loadDailyHistory();
      const k = todayKey();
      const d = todayDelta(Math.round(fsm.totalDrank), fsm.drinkCount, fsm.refillCount, fsm.cheatCount);
      hist[k] = {
        total_ml: d.total_ml,
        drink_count: d.drink_count,
        refill_count: d.refill_count,
        cheat_count: d.cheat_count
      };
      const keys = Object.keys(hist).sort().reverse();
      if (keys.length > 30) keys.slice(30).forEach(old => { delete hist[old]; });
      localStorage.setItem('shc_daily_history', JSON.stringify(hist));
      renderHistoryList(hist);
    }
    async function pushDailyCloud(){
      if (connMode !== 'cloud') return;
      const url = shcCoasterUrl(getCleanFbUrl());
      if (!url) return;
      try {
        if (!await shcEnsureToken()) return;
        const dd = todayDelta(Math.round(fsm.totalDrank), fsm.drinkCount, fsm.refillCount, fsm.cheatCount);
        const isi = JSON.stringify({
          total_ml: +dd.total_ml.toFixed(1),
          drink_count: dd.drink_count,
          refill_count: dd.refill_count,
          cheat_count: dd.cheat_count
        });
        const stamp = todayKey() + '|' + isi;
        if (stamp === lastDailyJson) return;
        lastDailyJson = stamp;
        await fetch(url + '/daily/' + todayKey() + '.json' + shcAuthSuffix(), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: isi
        });
      } catch(_){
        lastDailyJson = '';
      }
    }
    function $(id){ return document.getElementById(id); }
    if (typeof window !== 'undefined' && typeof document !== 'undefined' && $('bReset')) {
$('bReset').addEventListener('click', () => {
  if (connMode === 'cloud') {
    return;
  }
  saveTodayStatsToHistory();
  fsm.resetStats();
});
    }
  </script>
</body>
</html>
