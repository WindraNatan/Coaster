<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8FAFC">
<title>Masuk - Smart Hydration Coaster</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg: #F8FAFC;
  --panel: #FFFFFF;
  --panel2: #F1F5F9;
  --line: #E2E8F0;
  --line-strong: #CBD5E1;
  --ink: #0F172A;
  --dim: #475569;
  --muted: #94A3B8;
  --water: #0284C7;
  --water-hover: #0369A1;
  --water-tint: #E0F2FE;
  --water-light: #F0F9FF;
  --ok: #10B981;
  --ok-bg: #ECFDF5;
  --ok-border: #A7F3D0;
  --warn: #F59E0B;
  --alarm: #EF4444;
  --alarm-bg: #FEF2F2;
  --alarm-border: #FECACA;
  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
  --shadow-card: 0 4px 20px -4px rgba(15, 23, 42, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.03);
  --shadow-float: 0 12px 30px -4px rgba(15, 23, 42, 0.07), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
  --disp: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: var(--disp);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 18px;
  -webkit-font-smoothing: antialiased;
}
button,input{font:inherit;touch-action:manipulation}
.brand{
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.brand-mark{display:block;flex:none;border-radius:10px}
h1{
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
}
h1 span{color:var(--water)}
main{width:100%;max-width:480px}

.pill-row{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  justify-content: center;
}
a.pill{
  font-family: var(--disp);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 9999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--dim);
  text-decoration: none;
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
}
a.pill:hover{
  border-color: var(--water);
  color: var(--water);
  background: var(--water-light);
}

.card{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 26px;
  box-shadow: var(--shadow-card);
}
.card + .card{margin-top:16px}
.card h2{
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.card p{
  font-size: 13px;
  color: var(--dim);
  margin-bottom: 16px;
  line-height: 1.55;
}

label{
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--dim);
  margin: 14px 0 6px;
}
input{
  width: 100%;
  background: var(--panel2);
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13.5px;
  padding: 10px 14px;
  border-radius: 12px;
  min-height: 42px;
  transition: all 0.15s ease;
}
input:focus-visible{
  outline: 2px solid var(--water);
  border-color: var(--water);
  background: #FFFFFF;
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
}
input:disabled{opacity:.45;cursor:not-allowed}

.actions{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}
button{
  font-family: var(--disp);
  font-size: 13.5px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--ink);
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
button:hover{
  border-color: var(--water);
  color: var(--water);
  background: var(--water-light);
}
button.primary{
  background: var(--water);
  border-color: var(--water);
  color: #FFFFFF;
  box-shadow: 0 2px 8px 0 rgba(2, 132, 199, 0.25);
}
button.primary:hover{
  background: var(--water-hover);
  border-color: var(--water-hover);
  color: #FFFFFF;
}
button:disabled{opacity:.45;cursor:not-allowed}

.status{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--dim);
  line-height: 1.5;
  margin-bottom: 12px;
  padding: 8px 12px;
  background: var(--panel2);
  border-radius: 10px;
  border: 1px solid var(--line);
}
.status-dot{
  flex: 0 0 auto;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
}
.status-dot.ok{background:var(--ok)}
.status-dot.err{background:var(--alarm)}

details summary{
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--dim);
  min-height: 40px;
  display: flex;
  align-items: center;
  transition: color 0.15s ease;
}
details summary:hover{color:var(--water)}

.foot{
  font-size: 13px;
  color: var(--dim);
  margin-top: 24px;
  text-align: center;
  line-height: 1.6;
}
.foot a{
  color: var(--water);
  text-decoration: none;
  font-weight: 500;
}
.foot a:hover{text-decoration:underline}

@media(pointer:coarse){
  input{font-size:16px}
  button,a.pill,input{min-height:44px}
  .actions button{flex:1 1 auto}
}
@media(max-width:480px){
  body{padding:20px 14px}
  .card{padding:20px;border-radius:16px}
  .actions{flex-direction:column}
  .actions button,.actions a.pill{width:100%;justify-content:center}
}
</style>
</head>
<body>
<main>
  <div class="brand">
    <img class="brand-mark" src="icon.svg" alt="" width="36" height="36">
    <h1>Smart Hydration <span>Coaster</span></h1>
  </div>

  <div class="pill-row">
    <a class="pill" href="index.html">Simulator</a>
    <a class="pill" href="index.html?mode=usb">USB Live</a>
  </div>

  <section class="card" aria-label="Akun Firebase">
    <h2>Akun</h2>
    <div class="status"><i class="status-dot err" id="authDot"></i><span id="authStatus">Belum masuk.</span></div>

    <form id="authForm" novalidate>
      <label for="authEmailIn">Email</label>
      <input type="email" id="authEmailIn" placeholder="nama@email.com" aria-label="Email akun Firebase" autocomplete="username" required>

      <label for="authPassIn">Password</label>
      <input type="password" id="authPassIn" placeholder="minimal 6 karakter" aria-label="Password akun Firebase" autocomplete="current-password" required>

      <div class="actions">
        <button type="submit" class="primary" id="bAuthLogin">Masuk</button>
        <button type="button" id="bAuthRegister">Daftar akun baru</button>
      </div>
    </form>

    <details id="advancedBox" style="margin-top:16px;">
      <summary>Pengaturan lanjutan (proyek Firebase lain)</summary>
      <label for="authUrlIn">URL database</label>
      <input type="url" id="authUrlIn" placeholder="https://nama-proyek-default-rtdb.asia-southeast1.firebasedatabase.app"
             aria-label="URL dasar Firebase Realtime Database" autocomplete="off">

      <label for="authKeyIn">Web API Key proyek</label>
      <input type="text" id="authKeyIn" placeholder="AIza..." aria-label="Firebase Web API Key" autocomplete="off">

      <button type="button" id="bResetConfig" style="margin-top:12px;width:100%;">Kembalikan ke proyek bawaan</button>
    </details>
  </section>

  <section class="card" aria-label="Klaim alat">
    <h2>Klaim alat</h2>
    <div class="status"><i class="status-dot" id="claimDot"></i><span id="claimStatus">Alat belum tertaut ke akun ini.</span></div>
    <form id="claimForm" novalidate>
      <label for="deviceCodeIn">Kode alat</label>
      <input type="text" id="deviceCodeIn" placeholder="ABCD2345" aria-label="Kode alat" maxlength="8"
             autocomplete="off" style="text-transform:uppercase">
      <div class="actions">
        <button type="button" id="bClaim">Klaim alat</button>
        <button type="button" id="bFindDevice">Cari alat</button>
      </div>
    </form>
  </section>

  <section class="card" id="signedInCard" hidden aria-label="Akun aktif">
    <h2>Sudah masuk</h2>
    <p id="signedInLine">-</p>
    <div class="actions">
      <a class="pill" href="index.html?mode=cloud" style="border-color:var(--water);color:var(--water)">Buka dashboard</a>
      <button type="button" id="bAuthLogout">Keluar</button>
    </div>
  </section>

  <p class="foot"><a href="index.html">Lanjut tanpa akun</a></p>
</main>

<script src="auth.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);

function cleanUrl(raw){
  const v = (raw || '').trim().replace(/\/+$/, '');
  return v.startsWith('https://') ? v : '';
}
function setStatus(el, dot, text, kind){
  el.textContent = text;
  dot.className = 'status-dot ' + (kind || '');
}

function render(){
  const email = localStorage.getItem(SHC_EMAIL_KEY) || '';
  const ok = !!shcToken() || !!localStorage.getItem(SHC_REFRESH_KEY);
  setStatus($('authStatus'), $('authDot'), ok ? ('Masuk sebagai ' + email) : 'Belum masuk.', ok ? 'ok' : 'err');
  $('authForm').hidden = ok;
  $('signedInCard').hidden = !ok;
  $('signedInLine').textContent = ok ? ('Akun: ' + email) : '-';

  const device = shcDeviceUid();
  $('claimForm').hidden = !ok || !!device;
  if (device) setStatus($('claimStatus'), $('claimDot'), 'Alat tertaut: ' + device.slice(0, 8) + '…', 'ok');
  else if (ok) setStatus($('claimStatus'), $('claimDot'), 'Masukkan 8 karakter kode alat dari perangkat.', '');
  else setStatus($('claimStatus'), $('claimDot'), 'Masuk dulu untuk menautkan alat.', '');
}

async function doAuth(kind){
  const typedUrl = cleanUrl($('authUrlIn').value);
  const url = typedUrl || SHC_DEFAULT_URL;
  const email = ($('authEmailIn').value || '').trim();
  const pass = $('authPassIn').value || '';
  const key = ($('authKeyIn').value || '').trim() || SHC_DEFAULT_API_KEY;
  if (!url.startsWith('https://')) { setStatus($('authStatus'), $('authDot'), 'URL database wajib diawali https://', 'err'); return; }
  if (!email || !pass) { setStatus($('authStatus'), $('authDot'), 'Email dan password wajib diisi.', 'err'); return; }
  if (!key) { setStatus($('authStatus'), $('authDot'), 'Web API Key belum diisi. Buka Pengaturan lanjutan.', 'err'); return; }

  $('bAuthLogin').disabled = true;
  $('bAuthRegister').disabled = true;
  setStatus($('authStatus'), $('authDot'), 'Menghubungi Firebase…', '');
  try {
    const typedKey = ($('authKeyIn').value || '').trim();
    if (typedUrl) localStorage.setItem('shc_fb_url', url);
    else localStorage.removeItem('shc_fb_url');
    if (typedKey) localStorage.setItem('shc_api_key', key);
    else localStorage.removeItem('shc_api_key');
    await (kind === 'register' ? shcRegister(email, pass) : shcLogin(email, pass));
    $('authPassIn').value = '';
    render();
    setStatus($('authStatus'), $('authDot'), 'Masuk sebagai ' + (localStorage.getItem(SHC_EMAIL_KEY) || email), 'ok');
  } catch (e) {
    setStatus($('authStatus'), $('authDot'),
      (kind === 'register' ? 'Gagal daftar: ' : 'Gagal masuk: ') + (e.message || e), 'err');
  } finally {
    $('bAuthLogin').disabled = false;
    $('bAuthRegister').disabled = false;
  }
}

$('authForm').addEventListener('submit', e => { e.preventDefault(); doAuth('login'); });
$('bAuthRegister').addEventListener('click', () => doAuth('register'));

$('bFindDevice').addEventListener('click', async () => {
  const base = cleanUrl($('authUrlIn').value) || shcBaseUrl();
  const btn = $('bFindDevice');
  btn.disabled = true;
  setStatus($('claimStatus'), $('claimDot'), 'Mencari alat...', '');
  try {
    const code = await shcFindOwnDevice(base);
    if (!code) {
      setStatus($('claimStatus'), $('claimDot'),
        'Belum ada alat yang pernah terhubung ke akun ini. Nyalakan alat, sambungkan ke Wi-Fi lewat portal Coaster-Setup, lalu coba lagi.', 'err');
      return;
    }
    $('deviceCodeIn').value = code;
    setStatus($('claimStatus'), $('claimDot'),
      'Alat ditemukan: ' + code + '. Tekan Klaim alat.', 'ok');
  } catch (e) {
    setStatus($('claimStatus'), $('claimDot'),
      'Gagal mencari alat: ' + (e.message || e), 'err');
  } finally {
    btn.disabled = false;
  }
});

$('bClaim').addEventListener('click', async () => {
  const base = cleanUrl($('authUrlIn').value) || shcBaseUrl();
  if (!base) { setStatus($('claimStatus'), $('claimDot'), 'Isi URL database di kartu Akun.', 'err'); return; }
  if (!(await shcEnsureToken())) { setStatus($('claimStatus'), $('claimDot'), 'Sesi akun habis. Masuk ulang.', 'err'); return; }
  $('bClaim').disabled = true;
  setStatus($('claimStatus'), $('claimDot'), 'Mencari kode alat…', '');
  try {
    const uid = await shcClaimDevice(base, $('deviceCodeIn').value);
    $('deviceCodeIn').value = '';
    setStatus($('claimStatus'), $('claimDot'), 'Alat tertaut: ' + uid.slice(0, 8) + '…', 'ok');
    render();
  } catch (e) {
    setStatus($('claimStatus'), $('claimDot'), 'Gagal klaim: ' + (e.message || e), 'err');
  } finally {
    $('bClaim').disabled = false;
  }
});

$('bResetConfig').addEventListener('click', () => {
  localStorage.removeItem('shc_fb_url');
  localStorage.removeItem('shc_api_key');
  $('authUrlIn').value = '';
  $('authKeyIn').value = '';
  setStatus($('authStatus'), $('authDot'), 'Kembali ke proyek bawaan.', '');
});

$('bAuthLogout').addEventListener('click', () => {
  shcLogout();
  localStorage.removeItem('shc_device_uid');
  render();
  setStatus($('authStatus'), $('authDot'), 'Sudah keluar.', '');
});

$('authUrlIn').value = localStorage.getItem('shc_fb_url') || '';
$('authEmailIn').value = localStorage.getItem(SHC_EMAIL_KEY) || '';
$('authKeyIn').value = localStorage.getItem('shc_api_key') || '';
render();

if (new URLSearchParams(location.search).get('next') === 'dashboard'
    && (shcToken() || localStorage.getItem(SHC_REFRESH_KEY))) {
  location.replace('index.html?mode=cloud');
}

if ('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (sessionStorage.getItem('shc_sw_reloaded')) return;
    sessionStorage.setItem('shc_sw_reloaded', '1');
    location.reload();
  });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
